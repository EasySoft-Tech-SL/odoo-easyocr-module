[options]
admin_passwd = admin
; Mounting a config file replaces the image default, so the addons path has to
; be declared here or /mnt/extra-addons is invisible and no custom module loads.
; Every path listed here must exist: Odoo walks the list when serving any
; /web/static/ file and a missing entry turns every one of them into a 500.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
list_db = True
; With no filter Odoo refuses to guess a database, so any request that arrives
; without a session cookie is answered by the server-wide controllers only.
; The web app's manifest, its icon and its service worker are fetched that way
; on purpose -- they are public and the browser asks for them before there is a
; session -- so without this line all three answer 404 and the page stops being
; installable.
;
; WARNING: this decides which database Odoo will answer a request on, and the
; tests that talk HTTP (HttpCase) go through real requests. Running the suite
; against a database whose name does not match this pattern makes those tests
; fail with 403 and 200-instead-of-409, which looks like a broken controller and
; is not. Comment the line out for that, or name the database odoo19.
dbfilter = ^odoo19$
