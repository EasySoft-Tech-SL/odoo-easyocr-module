[options]
admin_passwd = admin
; Mounting a config file replaces the image default, so the addons path has to
; be declared here or /mnt/extra-addons is invisible and no custom module loads.
; Every path listed here must exist: Odoo walks the list when serving any
; /web/static/ file and a missing entry turns every one of them into a 500.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
list_db = True
