# Entorno de desarrollo Odoo Community para el port del modulo EasyOCR.
#
# Puertos elegidos a proposito, medidos en esta maquina el 2026-10-07:
#   80/443  httpd de Laragon          8080  nginx        5432  PostgreSQL nativo
#   5433    reservado por docker-pg-db-1 (otro proyecto)
#   8088    reservado por docker-pg-dolibarr-1
# Por eso, uno por serie: 8069 Odoo 19, 8070 Odoo 18, 8071 Odoo 20, 8072 Odoo 17
# y 8073 Odoo 16. PostgreSQL interno en 5434.
#
# restart: "no" a proposito. En esta maquina ya hay 10 contenedores
# unless-stopped que se levantan solos y se comen la RAM de la WSL.
#
# UN SOLO FICHERO, IDENTICO EN TODAS LAS RAMAS. Ninguna linea depende de en cual
# estas: cada servicio monta su checkout por la carpeta hermana, y `../odoo-easyocr-18`
# resuelve a la misma ruta tanto desde `odoo-easyocr` como desde `odoo-easyocr-18`
# (`odoo-easyocr-18/../odoo-easyocr-18` es ella misma). Asi una copia vale para
# todas y no hay una linea que se quede atras.
#
# ⚠️ Se levanta SIEMPRE desde el arbol principal, D:/GIT/odoo-easyocr: los
# contenedores y los volumenes tienen nombre fijado, y compose se niega a
# recrear un contenedor que pertenece a otro proyecto. Lanzarlo desde el
# worktree de otra serie da "container name is already in use".

services:
  db:
    image: postgres:16-alpine
    container_name: odoo-easyocr-db
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: "no"

  # The module sits at the root of the repository -- the Apps Store scans the
  # root and does not recurse -- so the repository root IS the addons path: the
  # container sees /mnt/extra-addons/easyocr/. Odoo lists the direct children of
  # the path and only a folder with a __manifest__.py becomes a module, so
  # tools/, tests/, docs/ and config/ are ignored.
  #
  # One container per series, because one folder cannot hold two branches at
  # once, and Odoo refuses a module whose version does not match its series
  # ("incompatible version, setting installable=False"). Created with:
  #   git worktree add D:/GIT/odoo-easyocr-16 -b 16.0
  #   git worktree add D:/GIT/odoo-easyocr-17 -b 17.0
  #   git worktree add D:/GIT/odoo-easyocr-18 18.0
  #   git worktree add D:/GIT/odoo-easyocr-20 -b 20.0
  #   D:/GIT/odoo-easyocr        es el arbol principal, en 19.0

  odoo16:
    image: odoo:16.0
    container_name: odoo-easyocr-16
    depends_on:
      - db
    ports:
      - "127.0.0.1:8073:8069"
    volumes:
      - ./config/odoo16.conf:/etc/odoo/odoo.conf:ro
      - ../odoo-easyocr-16:/mnt/extra-addons
      - odoo16-data:/var/lib/odoo
    restart: "no"

  odoo17:
    image: odoo:17.0
    container_name: odoo-easyocr-17
    depends_on:
      - db
    ports:
      - "127.0.0.1:8072:8069"
    volumes:
      - ./config/odoo17.conf:/etc/odoo/odoo.conf:ro
      - ../odoo-easyocr-17:/mnt/extra-addons
      - odoo17-data:/var/lib/odoo
    restart: "no"

  odoo18:
    image: odoo:18.0
    container_name: odoo-easyocr-18
    depends_on:
      - db
    ports:
      - "127.0.0.1:8070:8069"
    volumes:
      - ./config/odoo18.conf:/etc/odoo/odoo.conf:ro
      - ../odoo-easyocr-18:/mnt/extra-addons
      - odoo18-data:/var/lib/odoo
    restart: "no"

  odoo19:
    image: odoo:19.0
    container_name: odoo-easyocr-19
    depends_on:
      - db
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - ./config/odoo19.conf:/etc/odoo/odoo.conf:ro
      - ../odoo-easyocr:/mnt/extra-addons
      - odoo19-data:/var/lib/odoo
    restart: "no"

  odoo20:
    image: odoo:20.0
    container_name: odoo-easyocr-20
    depends_on:
      - db
    ports:
      - "127.0.0.1:8071:8069"
    volumes:
      - ./config/odoo20.conf:/etc/odoo/odoo.conf:ro
      - ../odoo-easyocr-20:/mnt/extra-addons
      - odoo20-data:/var/lib/odoo
    restart: "no"

# El nombre va fijado a mano para que no lo derive del directorio: el entorno se
# puede levantar desde cualquiera de las ramas, y sin esto compose tomaria cada
# carpeta por un proyecto distinto y crearia volumenes nuevos y vacios, que es
# el filestore de los adjuntos. Los que ya existen se llaman asi.
volumes:
  db-data:
    name: odoo-easyocr_db-data
  odoo16-data:
    name: odoo-easyocr_odoo16-data
  odoo17-data:
    name: odoo-easyocr_odoo17-data
  odoo18-data:
    name: odoo-easyocr_odoo18-data
  odoo19-data:
    name: odoo-easyocr_odoo19-data
  odoo20-data:
    name: odoo-easyocr_odoo20-data
