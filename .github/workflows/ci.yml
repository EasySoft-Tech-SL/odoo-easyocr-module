name: CI

on:
  push:
    branches:
      - '18.0'
      - '19.0'
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Module checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python syntax
        run: python -m compileall -q addons

      - name: Manifest and layout
        run: python tools/check_module.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript tests
        # No arguments: node walks the repository and runs every *.test.mjs on
        # its own, which is how the box arithmetic is checked without a browser.
        run: node --test

      - name: XML well-formedness
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          failed = False
          for path in sorted(pathlib.Path('addons').rglob('*.xml')):
              try:
                  ET.parse(path)
              except ET.ParseError as error:
                  print(f'FAIL  {path}: {error}', file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY
