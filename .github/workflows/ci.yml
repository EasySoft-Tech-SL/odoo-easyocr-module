name: CI

on:
  push:
    branches:
      - '16.0'
      - '17.0'
      - '18.0'
      - '19.0'
      - '20.0'
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Module checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python syntax
        # The whole repository, not just the module folder: the module now sits
        # at the root next to tools/ and tests/, so there is no single folder
        # that holds every file Python parses. .git is the only tree worth
        # skipping, and compileall filters directories, so it does not descend.
        run: python -m compileall -q -x '\.git' .

      - name: Manifest and layout
        run: python tools/check_module.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript tests
        # No arguments: node walks the repository and runs every *.test.mjs on
        # its own, which is how the box arithmetic is checked without a browser.
        run: node --test

      - name: XML well-formedness
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          failed = False
          for path in sorted(pathlib.Path('.').rglob('*.xml')):
              if '.git' in path.parts:
                  continue
              try:
                  ET.parse(path)
              except ET.ParseError as error:
                  print(f'FAIL  {path}: {error}', file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY
